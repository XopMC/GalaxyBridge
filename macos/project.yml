name: GalaxyBridge
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Internal Debug: debug
  Developer ID Release: release
  App Store Release: release
packages:
  GalaxyBridgeLocal:
    path: ..
targets:
  GalaxyBridgeInternal:
    type: application
    platform: macOS
    sources:
      - path: GalaxyBridgeMac
        excludes: [Info.plist, Resources, Assets.xcassets]
    resources:
      - path: GalaxyBridgeMac/Resources
      - path: GalaxyBridgeMac/Assets.xcassets
      - path: ../third_party/scrcpy/scrcpy-server-v4.1
    info:
      path: GalaxyBridgeMac/Info.plist
    entitlements:
      path: Entitlements/GalaxyBridge-Internal.entitlements
    dependencies:
      - package: GalaxyBridgeLocal
        product: GalaxyBridgeCore
      - package: GalaxyBridgeLocal
        product: GalaxyBridgeEnhancedCore
      - package: GalaxyBridgeLocal
        product: GalaxyBridgeProtocol
      - package: GalaxyBridgeLocal
        product: CSQLite
      - sdk: GameController.framework
      - target: GalaxyBridgeCameraExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xopmc.GalaxyBridge
        PRODUCT_NAME: GalaxyBridge
        ARCHS: arm64
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Internal Debug:
          ENABLE_HARDENED_RUNTIME: false
        Developer ID Release:
          ENABLE_HARDENED_RUNTIME: true
  GalaxyBridgeAppStore:
    type: application
    platform: macOS
    sources:
      - path: GalaxyBridgeMac
        excludes:
          - Info.plist
          - Resources
          - Assets.xcassets
          - Transport/ADBClient.swift
          - Transport/ADBOwnedRuntime.swift
          - Transport/ADBCommandRunner.swift
          - Transport/ScrcpySession.swift
          - Transport/ADBIdentityBinder.swift
          - Security/ADBBindingStore.swift
          - ApplicationCatalogEnhancedClient.swift
          - ApplicationWindowSession.swift
          - ApplicationWindowCoordinator.swift
    resources:
      - path: GalaxyBridgeMac/Resources
      - path: GalaxyBridgeMac/Assets.xcassets
    info:
      path: GalaxyBridgeMac/Info.plist
    entitlements:
      path: Entitlements/GalaxyBridge-AppStore.entitlements
    dependencies:
      - package: GalaxyBridgeLocal
        product: GalaxyBridgeCore
      - package: GalaxyBridgeLocal
        product: GalaxyBridgeProtocol
      - package: GalaxyBridgeLocal
        product: CSQLite
      - sdk: GameController.framework
      - target: GalaxyBridgeCameraExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xopmc.GalaxyBridge
        PRODUCT_NAME: GalaxyBridge
        ARCHS: arm64
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "$(inherited) -DGALAXYBRIDGE_APP_STORE"
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
  GalaxyBridgeCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: GalaxyBridgeCameraExtension
        excludes: [Info.plist, GalaxyBridgeCameraExtension.entitlements]
    info:
      path: GalaxyBridgeCameraExtension/Info.plist
    entitlements:
      path: GalaxyBridgeCameraExtension/GalaxyBridgeCameraExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xopmc.GalaxyBridge.CameraExtension
        PRODUCT_NAME: GalaxyBridgeCameraExtension
        ARCHS: arm64
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ENABLE_APP_SANDBOX: true
        CODE_SIGN_STYLE: Automatic
schemes:
  GalaxyBridge Internal:
    build:
      targets:
        GalaxyBridgeInternal: all
    run:
      config: Internal Debug
    archive:
      config: Developer ID Release
  GalaxyBridge App Store:
    build:
      targets:
        GalaxyBridgeAppStore: all
    run:
      config: App Store Release
    archive:
      config: App Store Release
