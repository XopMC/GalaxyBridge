syntax = "proto3";

package galaxybridge.v1;

option java_multiple_files = true;
option java_package = "com.xopmc.galaxybridge.protocol.v1";
option java_outer_classname = "GalaxyBridgeProtocol";
option swift_prefix = "GB";

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string device_id = 3;
  string session_id = 4;
  uint64 message_id = 5;

  oneof payload {
    Hello hello = 10;
    PairingRequest pairing_request = 11;
    PairingResponse pairing_response = 12;
    CapabilityUpdate capability_update = 13;
    OpenChannel open_channel = 14;
    InputEvent input_event = 15;
    ClipboardUpdate clipboard_update = 16;
    NotificationEvent notification_event = 17;
    NotificationAction notification_action = 18;
    TransferManifest transfer_manifest = 19;
    TransferChunk transfer_chunk = 20;
    TransferAck transfer_ack = 21;
    SmsEvent sms_event = 22;
    CallEvent call_event = 23;
    CameraConfiguration camera_configuration = 24;
    ErrorEvent error = 25;
    Ping ping = 26;
    Pong pong = 27;
    AdbBindingRequest adb_binding_request = 28;
    AdbBindingResponse adb_binding_response = 29;
    SessionAuthentication session_authentication = 30;
    PairingCommit pairing_commit = 31;
    PairingCommitAck pairing_commit_ack = 32;
    CameraStatus camera_status = 33;
    TransferCancel transfer_cancel = 34;
    NotificationSnapshot notification_snapshot = 35;
    NotificationActionResult notification_action_result = 36;
    InternetSharingRequest internet_sharing_request = 37;
    InternetSharingStatus internet_sharing_status = 38;
    DirectLinkRequest direct_link_request = 39;
    DirectLinkDescriptor direct_link_descriptor = 40;
    DirectLinkStatus direct_link_status = 41;
    ShellBridgeRequest shell_bridge_request = 42;
    ShellBridgeResult shell_bridge_result = 43;
    FeatureConfigurationRequest feature_configuration_request = 44;
    FeatureConfigurationResult feature_configuration_result = 45;
  }
}

message Hello {
  string display_name = 1;
  bytes public_key_fingerprint = 2;
  repeated TransportKind transports = 3;
}

message PairingRequest {
  bytes one_time_token = 1;
  bytes identity_public_key = 2;
  string display_name = 3;
  bytes client_nonce = 4;
  bytes transcript_signature = 5;
}

message PairingResponse {
  bool accepted = 1;
  bytes identity_public_key = 2;
  string rejection_reason = 3;
  bytes server_nonce = 4;
  bytes transcript_signature = 5;
  bytes tls_certificate_sha256 = 6;
  string display_name = 7;
  string device_id = 8;
}

message PairingCommit {
  bytes transcript_signature = 1;
  string host_id = 2;
  string device_id = 3;
  string session_id = 4;
}

message PairingCommitAck {
  bool committed = 1;
  string host_id = 2;
  string device_id = 3;
  string session_id = 4;
  bytes transcript_signature = 5;
}

message AdbBindingRequest {
  string adb_serial = 1;
  bytes nonce = 2;
}

message AdbBindingResponse {
  string adb_serial = 1;
  bytes nonce = 2;
  bytes identity_public_key = 3;
  bytes signature = 4;
}

message SessionAuthentication {
  bytes identity_public_key = 1;
  bytes nonce = 2;
  int64 timestamp_unix_seconds = 3;
  bytes signature = 4;
}

enum TransportKind {
  TRANSPORT_KIND_UNSPECIFIED = 0;
  TRANSPORT_KIND_USB_ADB = 1;
  TRANSPORT_KIND_WIRELESS_ADB = 2;
  TRANSPORT_KIND_COMPANION_LAN = 3;
  TRANSPORT_KIND_DIRECT_WIFI = 4;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SCREEN_CAPTURE = 1;
  CAPABILITY_INPUT_INJECTION = 2;
  CAPABILITY_AUDIO_FORWARDING = 3;
  CAPABILITY_CLIPBOARD_READ = 4;
  CAPABILITY_CLIPBOARD_WRITE = 5;
  CAPABILITY_FILES = 6;
  CAPABILITY_NOTIFICATIONS = 7;
  CAPABILITY_SMS = 8;
  CAPABILITY_CALLS = 9;
  CAPABILITY_CAMERA_STREAM = 10;
  CAPABILITY_VIRTUAL_DISPLAY = 11;
  CAPABILITY_RECORDING = 12;
  // Implementation support, independent of current notification permission.
  CAPABILITY_NOTIFICATION_ACTION_RESULTS = 13;
  CAPABILITY_NEARBY_LINK = 14;
  CAPABILITY_INTERNET_GATEWAY = 15;
  CAPABILITY_PRIVILEGED_BRIDGE = 16;
  CAPABILITY_FEATURE_CONFIGURATION = 17;
  // Typed read-only retirement proofs, independent of broker activation.
  CAPABILITY_CAPTURE_RETIREMENT_PROOF = 18;
}

// CONTROL only after signed session authentication. An empty enabled list means all off.
// Camera/internet permit future explicit user actions; they never start capture or routing.
message FeatureConfigurationRequest {
  string request_id = 1; // lowercase UUID, maximum 36 bytes
  string target_device_id = 2;
  uint64 revision = 3; // strictly increasing per paired host, durable before acknowledgement
  repeated string enabled_feature_ids = 4; // known shipping and optional calls IDs, at most 10, each at most 32 bytes
}
message FeatureConfigurationResult {
  string request_id = 1;
  string target_device_id = 2;
  uint64 revision = 3;
  bool accepted = 4;
  repeated string enabled_feature_ids = 5;
  string error_code = 6;
}

message CapabilityUpdate {
  TransportKind transport = 1;
  repeated Capability available = 2;
  map<string, string> unavailable_reasons = 3;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_CONTROL = 1;
  CHANNEL_KIND_EVENTS = 2;
  CHANNEL_KIND_VIDEO = 3;
  CHANNEL_KIND_AUDIO = 4;
  CHANNEL_KIND_FILES = 5;
  CHANNEL_KIND_CAMERA = 6;
  CHANNEL_KIND_INTERNET_PROXY = 7;
  CHANNEL_KIND_ENHANCED_STREAM = 8;
}

// These operations are admitted only after the existing signed session
// authentication. Credentials never belong in Bonjour or BLE advertisements.
message InternetSharingRequest {
  string request_id = 1;
  bool enabled = 2;
  string lease_id = 3;
}

message InternetSharingStatus {
  string request_id = 1;
  string lease_id = 2;
  bool enabled = 3;
  string upstream = 4; // "wifi", "cellular", or "unavailable"
  bool internet_validated = 5;
  string error_code = 6;
  uint64 bytes_sent = 7;
  uint64 bytes_received = 8;
}

message DirectLinkRequest {
  string request_id = 1;
  bool enabled = 2;
  string group_lease_id = 3;
  // Empty means create; populated means join an authenticated shared group.
  DirectLinkDescriptor join = 4;
  // Exact-lease handoff after the Mac has verified the offered TLS endpoint.
  bool confirmed = 5;
}

message DirectLinkDescriptor {
  string group_lease_id = 1;
  string owner_device_id = 2;
  uint64 generation = 3;
  string network_name = 4;
  string passphrase = 5;
  string owner_address = 6;
  uint32 companion_port = 7;
  string mode = 8; // "p2p" or "local_only_hotspot"
  string interface_name = 9;
  string device_id = 10;
  string device_address = 11;
  bytes tls_certificate_sha256 = 12;
  bytes identity_public_key = 13;
  string display_name = 14;
}

message DirectLinkStatus {
  string request_id = 1;
  string group_lease_id = 2;
  string state = 3;
  string error_code = 4;
  bool upstream_wifi_preserved = 5;
}

message ShellCaptureOptions {
  uint32 scid = 1;
  uint32 display_id = 2;
  string package_name = 3;
  uint32 max_size = 4;
  uint32 max_fps = 5;
  uint64 video_bit_rate = 6;
  string codec = 7;
  uint32 width = 8;
  uint32 height = 9;
  bool audio = 10;
  bool control = 11;
}

message ShellBridgeRequest {
  enum Operation {
    STATUS = 0;
    START_SCRCPY = 1;
    START_CLIPBOARD = 2;
    START_PANEL = 3;
    STOP = 4;
    LIST_APPLICATIONS = 5;
    VERIFY_RETIREMENT = 6;
    // Unlinks only an exact owned privacy-runtime JAR after PID/start absence
    // proof and a match to this broker's verified runtime bytes.
    RELEASE_RETIRED_RESOURCE = 7;
  }
  string request_id = 1;
  string lease_id = 2;
  string boot_generation = 3;
  Operation operation = 4;
  ShellCaptureOptions options = 5;
  bool power_on = 6;
  CaptureRetirementQuery retirement = 7;
}

// CONTROL only after signed authentication. VERIFY_RETIREMENT is read-only.
// Neither operation launches/kills processes or changes panel power, input,
// radios or routing. Resource release accepts a UUID, never a file path.
message CaptureRetirementQuery {
  enum Kind {
    PROBE_SUPPORT = 0;
    SCRCPY_CAPTURE = 1;
    DISPLAY_POWER_CONTROLLER = 2;
  }
  Kind kind = 1;
  uint32 scid = 2;
  uint32 pid = 3;
  uint64 process_start_ticks = 4;
  string owned_resource_id = 5; // canonical lowercase UUID; resource release only
  bytes resource_sha256 = 6; // exactly 32 bytes; resource release only
}

message PhysicalPanelPowerState {
  string physical_id = 1; // canonical unsigned 64-bit decimal, at most 20 bytes
  bool on = 2;
}

message CaptureRetirementProof {
  CaptureRetirementQuery.Kind kind = 1;
  uint32 scid = 2;
  uint32 pid = 3;
  uint64 process_start_ticks = 4;
  bool supported = 5;
  bool absent = 6;
  // Exact current physical state; at most eight unique panels. A controller
  // is settled only when its original snapshot matches this observation.
  repeated PhysicalPanelPowerState panels = 7;
  string owned_resource_id = 8;
  bool resource_removed = 9;
}

message ShellBridgeResult {
  string request_id = 1;
  string lease_id = 2;
  string boot_generation = 3;
  bool available = 4;
  string state = 5;
  string error_code = 6;
  repeated string stream_ids = 7;
  bytes application_catalog_json = 8;
  CaptureRetirementProof retirement_proof = 9;
}

message OpenChannel {
  ChannelKind kind = 1;
  string stream_id = 2;
  string codec = 3;
  uint32 display_id = 4;
  uint32 epoch = 5;
}

enum InputAction {
  INPUT_ACTION_UNSPECIFIED = 0;
  INPUT_ACTION_DOWN = 1;
  INPUT_ACTION_MOVE = 2;
  INPUT_ACTION_UP = 3;
  INPUT_ACTION_CANCEL = 4;
  INPUT_ACTION_SCROLL = 5;
  INPUT_ACTION_KEY = 6;
  INPUT_ACTION_TEXT = 7;
}

message InputEvent {
  InputAction action = 1;
  uint32 display_id = 2;
  uint32 display_epoch = 3;
  uint64 pointer_id = 4;
  float normalized_x = 5;
  float normalized_y = 6;
  float pressure = 7;
  float scroll_x = 8;
  float scroll_y = 9;
  uint32 buttons = 10;
  uint32 android_keycode = 11;
  uint32 modifiers = 12;
  string text = 13;
}

enum ClipboardKind {
  CLIPBOARD_KIND_UNSPECIFIED = 0;
  CLIPBOARD_KIND_TEXT = 1;
  CLIPBOARD_KIND_URL = 2;
  CLIPBOARD_KIND_PNG = 3;
}

message ClipboardUpdate {
  string change_id = 1;
  ClipboardKind kind = 2;
  bytes content = 3;
  bool sensitive = 4;
}

message NotificationEvent {
  string notification_id = 1;
  string package_name = 2;
  string app_label = 3;
  string title = 4;
  string body = 5;
  int64 posted_at_unix_ms = 6;
  repeated NotificationActionDescriptor actions = 7;
  bool removed = 8;
  bytes app_icon_png = 9;
  // True only when a newly opened events channel is replaying notifications
  // that were already active on the phone. They restore the Mac in-app list
  // but must not generate a fresh native macOS banner.
  bool initial_snapshot = 10;
}

// The events stream sends begin (complete=false), all currently active
// NotificationEvent rows with initial_snapshot=true, then end (complete=true).
// Only a complete snapshot is authoritative: IDs absent from it were removed.
// Live posts/removals follow end in order. Older peers may ignore this message.
message NotificationSnapshot {
  bool complete = 1;
}

message NotificationActionDescriptor {
  string action_id = 1;
  string title = 2;
  bool accepts_text = 3;
}

message NotificationAction {
  string notification_id = 1;
  string action_id = 2;
  string reply_text = 3;
  bool dismiss = 4;
  // Canonical UUID, generated once per deliberate user action. Empty for legacy peers.
  string request_id = 5;
}

message NotificationActionResult {
  string request_id = 1;
  string notification_id = 2;
  string action_id = 3;
  // Android accepted PendingIntent.send/cancelNotification, not chat/network delivery.
  bool accepted = 4;
  string error_code = 5;
}

message TransferManifest {
  string transfer_id = 1;
  string relative_name = 2;
  uint64 size = 3;
  string mime_type = 4;
  bytes sha256 = 5;
  uint64 confirmed_offset = 6;
}

message TransferChunk {
  string transfer_id = 1;
  uint64 offset = 2;
  bytes content = 3;
}

// Explicit user cancellation; authenticated channel ownership is checked by the receiver.
message TransferCancel {
  string transfer_id = 1;
}

message TransferAck {
  string transfer_id = 1;
  uint64 confirmed_offset = 2;
  bool complete = 3;
  string failure_reason = 4;
  // Actual provider-selected name, present only in a durable completion receipt.
  string published_name = 5;
}

message SmsEvent {
  string message_id = 1;
  string thread_id = 2;
  string address = 3;
  string body = 4;
  int64 timestamp_unix_ms = 5;
  bool outgoing = 6;
}

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_IDLE = 1;
  CALL_STATE_RINGING = 2;
  CALL_STATE_DIALING = 3;
  CALL_STATE_ACTIVE = 4;
  CALL_STATE_ENDED = 5;
}

message CallEvent {
  string call_id = 1;
  string address = 2;
  string display_name = 3;
  CallState state = 4;
  bool incoming = 5;
  int64 timestamp_unix_ms = 6;
  uint32 duration_seconds = 7;
  bool history = 8;
}

message CameraConfiguration {
  string camera_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 frames_per_second = 4;
  bool enabled = 5;
  string request_id = 6;
}

enum CameraCaptureState {
  CAMERA_CAPTURE_STATE_UNSPECIFIED = 0;
  CAMERA_CAPTURE_STATE_STARTING = 1;
  CAMERA_CAPTURE_STATE_AWAITING_USER_CONFIRMATION = 2;
  CAMERA_CAPTURE_STATE_STREAMING = 3;
  CAMERA_CAPTURE_STATE_STOPPED = 4;
  CAMERA_CAPTURE_STATE_FAILED = 5;
}

message CameraStatus {
  string request_id = 1;
  CameraCaptureState state = 2;
  string reason_code = 3;
  bool retryable = 4;
}

message ErrorEvent {
  string code = 1;
  string safe_message = 2;
  bool retryable = 3;
}

message Ping {
  uint64 monotonic_time_ns = 1;
}

message Pong {
  uint64 echoed_monotonic_time_ns = 1;
}
