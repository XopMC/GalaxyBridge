[package]
name = "galaxybridge-file-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"

[dependencies]
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
panic = "abort"
strip = true
