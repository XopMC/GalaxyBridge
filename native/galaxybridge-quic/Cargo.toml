[package]
name = "galaxybridge-quic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[dependencies]
quiche = { version = "=0.29.3", path = "vendor/quiche" }
boring = "=4.22.0"
libc = "=0.2.177"

[lib]
crate-type = ["rlib", "staticlib"]

[profile.release]
panic = "abort"
strip = "debuginfo"
